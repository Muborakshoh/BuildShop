<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS — СохтМатериал</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <style>
    .cms-layout{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 64px)}
    .cms-sidebar{background:var(--card);border-right:1px solid var(--border);padding:20px 0;overflow-y:auto}
    .cms-sidebar h3{padding:0 20px;margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
    .cms-nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:14px;color:var(--text);transition:background .15s}
    .cms-nav-item:hover{background:var(--bg2)}
    .cms-nav-item.active{background:var(--primary);color:#fff;font-weight:600}
    .cms-nav-item .icon{width:20px;text-align:center;font-size:16px}
    .cms-main{padding:24px 32px;overflow-y:auto}
    .cms-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .cms-header h2{margin:0;font-size:22px}
    .cms-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .cms-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:box-shadow .2s,transform .15s}
    .cms-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
    .cms-card h3{margin:0 0 8px;font-size:16px}
    .cms-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .cms-card .card-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .cms-empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .cms-empty p{font-size:15px;margin:12px 0}

    /* Block editor */
    .block-list{display:flex;flex-direction:column;gap:12px;margin:16px 0}
    .block-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative}
    .block-item .block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .block-item .block-header select{font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg)}
    .block-grip{cursor:grab;padding:4px 8px;color:var(--muted);font-size:18px}
    .block-actions{display:flex;gap:6px}

    /* Quill container */
    .ql-container{min-height:150px;font-size:15px;border-radius:0 0 8px 8px}
    .ql-toolbar{border-radius:8px 8px 0 0;background:var(--bg)}
    .ql-editor{min-height:150px}
    .ql-editor img{max-width:100%;border-radius:8px}

    /* Form styles */
    .cms-form{max-width:800px}
    .cms-form .form-group{margin-bottom:16px}
    .cms-form label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
    .cms-form input,.cms-form select,.cms-form textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text)}
    .cms-form textarea{min-height:80px;resize:vertical}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-actions{display:flex;gap:10px;margin-top:20px}

    /* Status badges */
    .status-draft{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
    .status-published{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
    .status-archived{background:#e5e7eb;color:#4b5563;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}

    /* Responsive */
    @media(max-width:768px){
      .cms-layout{grid-template-columns:1fr}
      .cms-sidebar{display:flex;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--border)}
      .cms-nav-item{white-space:nowrap;padding:8px 16px;border-radius:8px}
      .cms-main{padding:16px}
      .form-row{grid-template-columns:1fr}
    }

    .tab-bar{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
    .tab-btn{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
    .tab-btn:hover{color:var(--text)}

    .add-block-bar{display:flex;flex-wrap:wrap;gap:8px;padding:16px;background:var(--bg2);border-radius:10px;margin:12px 0}
    .add-block-btn{padding:8px 14px;border:1px dashed var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;transition:all .15s;color:var(--text)}
    .add-block-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--bg)}
    .cms-card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .identity-note{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;color:var(--muted);line-height:1.5}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <div class="brand-icon">С</div>
      <span data-i18n="cms_title">CMS Builder</span>
    </a>
    <nav class="nav" id="main-nav">
      <a href="/" data-i18n="nav_home">Асосӣ</a>
      <a href="/pages/admin-products.html" data-i18n="admin_products">Молҳо</a>
      <a href="/pages/admin-cms.html" class="active">CMS</a>
    </nav>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" />
          <span class="slider"></span>
        </label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value); loadSection(currentSection)">
          <option value="tj">TJ</option>
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
      </div>
      <button class="burger" id="burger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMenu()"></div>

<div class="cms-layout">
  <!-- Sidebar -->
  <aside class="cms-sidebar">
    <h3 data-i18n="cms_title">Конструктор</h3>
    <button class="cms-nav-item active" data-section="pages" onclick="switchSection('pages',this)">
      <span class="icon">📄</span> <span data-i18n="cms_pages">Саҳифаҳо</span>
    </button>
    <button class="cms-nav-item" data-section="news" onclick="switchSection('news',this)">
      <span class="icon">📰</span> <span data-i18n="cms_news">Навигарӣ</span>
    </button>
    <button class="cms-nav-item" data-section="menus" onclick="switchSection('menus',this)">
      <span class="icon">🔗</span> <span data-i18n="cms_menus">Менюҳо</span>
    </button>
    <button class="cms-nav-item" data-section="settings" onclick="switchSection('settings',this)">
      <span class="icon">⚙️</span> <span data-i18n="cms_settings">Танзимот</span>
    </button>
  </aside>

  <!-- Main content area -->
  <main class="cms-main" id="cms-content">
    <!-- Sections rendered by JS -->
  </main>
</div>

<div id="modal-root"></div>
<div class="toast-container" id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/theme.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="/js/admin-cms.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>СохтМатериал</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .page-content{max-width:900px;margin:0 auto;padding:40px 24px}
    .page-content h1{font-size:28px;margin-bottom:20px}
    .cms-block{margin-bottom:32px}
    .cms-block img{max-width:100%;border-radius:10px}
    .cms-block .richtext{line-height:1.8;font-size:16px}
    .cms-block .richtext h1,.cms-block .richtext h2,.cms-block .richtext h3{margin:20px 0 10px}
    .cms-block .richtext ul,.cms-block .richtext ol{padding-left:24px;margin:12px 0}
    .cms-block .richtext blockquote{border-left:4px solid var(--primary);padding:12px 20px;background:var(--bg2);border-radius:0 8px 8px 0;margin:16px 0}
    .cms-block .richtext a{color:var(--primary)}
    .cms-hero-block{padding:80px 24px;text-align:center;border-radius:16px;background:linear-gradient(rgba(26,35,50,.6),rgba(26,35,50,.7)),var(--bg2) center/cover no-repeat;color:#fff;margin-bottom:32px}
    .cms-hero-block h1{font-size:32px;margin-bottom:12px}
    .cms-hero-block p{font-size:17px;opacity:.9;max-width:600px;margin:0 auto 20px}
    .cms-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .cms-gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px}
    .cms-video iframe{width:100%;height:400px;border:none;border-radius:12px}
    .cms-contacts-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
    .cms-contacts-block div{font-size:15px}
    .cms-contacts-block strong{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}
    .cms-separator{border:none;border-top:2px solid var(--border);margin:32px 0}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><div class="brand-icon">С</div><span data-i18n="brand_full">СохтМатериал</span></a>
    <nav class="nav" id="main-nav">
      <a href="/" data-i18n="nav_home">Асосӣ</a>
      <a href="/pages/categories.html" data-i18n="nav_categories">Категорияҳо</a>
      <a href="/pages/products.html" data-i18n="nav_products">Маҳсулотҳо</a>
      <a href="/pages/news.html">Навигарӣ</a>
      <a href="/pages/cart.html"><span data-i18n="nav_orders">Тамос</span> <span class="cart-badge" id="cart-count">0</span></a>
      <a href="/pages/admin-cms.html" class="admin-only" style="display:none">CMS</a>
    </nav>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" /><span class="slider"></span></label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
          <option value="tj">TJ</option><option value="ru">RU</option><option value="en">EN</option>
        </select>
      </div>
      <a href="/pages/auth.html" id="auth-link" class="btn btn-primary btn-login" data-i18n="login">Ворид шудан</a>
      <button class="burger" id="burger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMenu()"></div>

<div class="page-content" id="page-content">
  <div class="skeleton" style="height:40px;width:60%;margin-bottom:20px"></div>
  <div class="skeleton" style="height:200px;margin-bottom:16px"></div>
  <div class="skeleton" style="height:100px"></div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <span>&copy; 2024 СохтМатериал</span>
  </div>
</footer>
<div class="toast-container" id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/cms-nav.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/theme.js"></script>
<script>
function toggleMenu(){
  document.getElementById("main-nav").classList.toggle("open");
  document.getElementById("burger").classList.toggle("open");
  document.getElementById("mobile-overlay").classList.toggle("open");
}

function renderBlock(b) {
  switch (b.block_type) {
    case "richtext":
      return '<div class="cms-block"><div class="richtext">' + (b.content||'') + '</div></div>';
    case "image":
      return '<div class="cms-block"><img src="' + escapeHtml(safeUrl(b.image_url)) + '" alt="' + escapeHtml(b.content||'') + '" loading="lazy" /></div>';
    case "hero": {
      let cfg = {};
      try { cfg = JSON.parse(b.settings_json || "{}"); } catch {}
      const bg = b.image_url ? 'background-image:url('+escapeHtml(safeUrl(b.image_url))+')' : '';
      return '<div class="cms-hero-block" style="'+bg+'">' +
        '<h1>' + escapeHtml(cfg.title||'') + '</h1>' +
        '<p>' + escapeHtml(cfg.subtitle||'') + '</p>' +
        (cfg.btn_text ? '<a href="'+escapeHtml(safeUrl(cfg.btn_url, '#'))+'" class="btn btn-gradient btn-lg">'+escapeHtml(cfg.btn_text)+'</a>' : '') +
        '</div>';
    }
    case "gallery": {
      const urls = (b.content||'').split('\n').filter(u=>u.trim());
      return '<div class="cms-block"><div class="cms-gallery">' +
        urls.map(u => '<img src="'+escapeHtml(safeUrl(u.trim()))+'" loading="lazy" />').join('') +
        '</div></div>';
    }
    case "video":
      return '<div class="cms-block cms-video"><iframe src="' + escapeHtml(safeUrl(b.content, 'about:blank')) + '" allowfullscreen></iframe></div>';
    case "html":
      return '<div class="cms-block">' + (b.content||'') + '</div>';
    case "products":
      return '<div class="cms-block"><div class="product-grid" id="cms-products-'+b.id+'"></div></div>';
    case "categories":
      return '<div class="cms-block"><div class="categories-grid" id="cms-categories-'+b.id+'"></div></div>';
    case "contacts": {
      let cfg = {};
      try { cfg = JSON.parse(b.settings_json || "{}"); } catch {}
      return '<div class="cms-block"><div class="cms-contacts-block">' +
        (cfg.phone ? '<div><strong>Телефон</strong>'+escapeHtml(cfg.phone)+'</div>' : '') +
        (cfg.email ? '<div><strong>Email</strong>'+escapeHtml(cfg.email)+'</div>' : '') +
        (cfg.address ? '<div><strong>Суроға</strong>'+escapeHtml(cfg.address)+'</div>' : '') +
        '</div></div>';
    }
    case "separator":
      return '<hr class="cms-separator" />';
    default:
      return '';
  }
}

async function loadDynamicBlocks(blocks) {
  for (const b of blocks) {
    if (b.block_type === 'products') {
      let cfg = {};
      try { cfg = JSON.parse(b.settings_json || "{}"); } catch {}
      const limit = cfg.limit || 8;
      const catParam = cfg.category_id ? '&category_id='+cfg.category_id : '';
      try {
        const products = await API.request('/api/products?limit='+encodeURIComponent(limit)+catParam);
        const el = document.getElementById('cms-products-'+b.id);
        if (el && products.length) {
          el.innerHTML = products.map(p => '<div class="product-card"><a href="/pages/product.html?id='+p.id+'"><img src="'+escapeHtml(safeUrl(p.image_url))+'" alt="'+escapeHtml(p.name)+'" loading="lazy" /></a><div class="product-card-body"><h3>'+escapeHtml(p.name)+'</h3><div class="product-price">'+money(p.price)+'</div></div></div>').join('');
        }
      } catch {}
    }
    if (b.block_type === 'categories') {
      try {
        const cats = await API.request('/api/categories');
        const el = document.getElementById('cms-categories-'+b.id);
        if (el && cats.length) {
          el.innerHTML = cats.map(c => '<a href="/pages/products.html?category='+c.id+'" class="category-card"><img src="'+escapeHtml(safeUrl(c.image_url))+'" alt="'+escapeHtml(c.name)+'" /><div class="category-card-body"><h3>'+escapeHtml(c.name)+'</h3></div></a>').join('');
        }
      } catch {}
    }
  }
}

async function loadPage() {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  if (!slug) {
    document.getElementById("page-content").innerHTML = '<p class="muted" style="text-align:center;padding:60px">Саҳифа ёфт нашуд</p>';
    return;
  }
  try {
    const page = await fetch('/api/cms/pages/public/by-slug/' + encodeURIComponent(slug)).then(r => {
      if (!r.ok) throw new Error('Саҳифа ёфт нашуд');
      return r.json();
    });
    document.title = (page.meta_title || page.title) + ' — СохтМатериал';
    const blocksHtml = (page.blocks || []).sort((a,b) => a.sort_order - b.sort_order).map(renderBlock).join('');
    document.getElementById("page-content").innerHTML =
      '<h1>' + escapeHtml(page.title) + '</h1>' +
      (page.description ? '<p class="muted" style="font-size:16px;margin-bottom:24px">'+escapeHtml(page.description)+'</p>' : '') +
      blocksHtml;
    loadDynamicBlocks(page.blocks || []);
  } catch (e) {
    document.getElementById("page-content").innerHTML = '<p class="muted" style="text-align:center;padding:60px">' + escapeHtml(e.message) + '</p>';
  }
}

loadPage();
</script>
</body>
</html>

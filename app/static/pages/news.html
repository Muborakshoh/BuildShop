<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Навигарӣ — СохтМатериал</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .news-page{max-width:1000px;margin:0 auto;padding:40px 24px}
    .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:24px}
    .news-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .2s,transform .15s;cursor:pointer}
    .news-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
    .news-card img{width:100%;height:180px;object-fit:cover}
    .news-card-body{padding:16px 20px}
    .news-card-body h3{margin:0 0 8px;font-size:17px}
    .news-card-body p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
    .news-card-body .date{font-size:12px;color:var(--muted)}
    .news-pin{position:absolute;top:10px;right:10px;background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .news-card{position:relative}

    .news-detail{max-width:800px;margin:0 auto;padding:40px 24px}
    .news-detail h1{font-size:28px;margin-bottom:12px}
    .news-detail .meta{color:var(--muted);margin-bottom:24px;font-size:14px}
    .news-detail img.hero{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:24px}
    .news-detail .body{line-height:1.8;font-size:16px}
    .news-detail .body h1,.news-detail .body h2,.news-detail .body h3{margin:20px 0 10px}
    .news-detail .body img{max-width:100%;border-radius:8px}
    .news-detail .body blockquote{border-left:4px solid var(--primary);padding:12px 20px;background:var(--bg2);border-radius:0 8px 8px 0;margin:16px 0}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><div class="brand-icon">С</div><span data-i18n="brand_full">СохтМатериал</span></a>
    <nav class="nav" id="main-nav">
      <a href="/" data-i18n="nav_home">Асосӣ</a>
      <a href="/pages/categories.html" data-i18n="nav_categories">Категорияҳо</a>
      <a href="/pages/products.html" data-i18n="nav_products">Маҳсулотҳо</a>
      <a href="/pages/news.html" class="active">Навигарӣ</a>
      <a href="/pages/cart.html"><span data-i18n="nav_orders">Тамос</span> <span class="cart-badge" id="cart-count">0</span></a>
      <a href="/pages/admin-cms.html" class="admin-only" style="display:none">CMS</a>
    </nav>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" /><span class="slider"></span></label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
          <option value="tj">TJ</option><option value="ru">RU</option><option value="en">EN</option>
        </select>
      </div>
      <a href="/pages/auth.html" id="auth-link" class="btn btn-primary btn-login" data-i18n="login">Ворид шудан</a>
      <button class="burger" id="burger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMenu()"></div>

<div id="news-root"></div>

<footer class="footer">
  <div class="footer-bottom">
    <span>&copy; 2024 СохтМатериал</span>
  </div>
</footer>
<div class="toast-container" id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/cms-nav.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/theme.js"></script>
<script>
function toggleMenu(){
  document.getElementById("main-nav").classList.toggle("open");
  document.getElementById("burger").classList.toggle("open");
  document.getElementById("mobile-overlay").classList.toggle("open");
}

const root = document.getElementById("news-root");
const params = new URLSearchParams(location.search);
const newsSlug = params.get("slug");

if (newsSlug) {
  loadNewsDetail(newsSlug);
} else {
  loadNewsList();
}

async function loadNewsList() {
  try {
    const news = await fetch('/api/cms/news/public?limit=50').then(r=>r.json());
    if (!news.length) {
      root.innerHTML = '<div class="news-page"><h2>Навигарӣ</h2><p class="muted" style="text-align:center;padding:40px">Ҳанӯз хабаре нест</p></div>';
      return;
    }
    root.innerHTML = '<div class="news-page"><h2>Навигарӣ</h2><div class="news-grid">' +
      news.map(n => '<div class="news-card" onclick="location.href=\'/pages/news.html?slug='+encodeURIComponent(n.slug)+'\'">' +
        (n.pinned ? '<span class="news-pin">📌</span>' : '') +
        (n.image_url ? '<img src="'+escapeHtml(safeUrl(n.image_url))+'" loading="lazy" />' : '') +
        '<div class="news-card-body"><h3>'+escapeHtml(n.title)+'</h3>' +
        (n.summary ? '<p>'+escapeHtml(n.summary)+'</p>' : '') +
        '<span class="date">'+new Date(n.created_at).toLocaleDateString("ru")+'</span></div></div>'
      ).join('') + '</div></div>';
  } catch(e) {
    root.innerHTML = '<p class="muted" style="text-align:center;padding:60px">'+escapeHtml(e.message)+'</p>';
  }
}

async function loadNewsDetail(slug) {
  try {
    const n = await fetch('/api/cms/news/public/by-slug/'+encodeURIComponent(slug)).then(r=>{
      if(!r.ok) throw new Error('Хабар ёфт нашуд');
      return r.json();
    });
    document.title = n.title + ' — СохтМатериал';
    root.innerHTML = '<div class="news-detail">' +
      '<a href="/pages/news.html" style="color:var(--primary);font-size:14px">← Ба навигарӣ</a>' +
      '<h1 style="margin-top:16px">'+escapeHtml(n.title)+'</h1>' +
      '<div class="meta">'+new Date(n.created_at).toLocaleDateString("ru","long")+'</div>' +
      (n.image_url ? '<img class="hero" src="'+escapeHtml(safeUrl(n.image_url))+'" />' : '') +
      '<div class="body">'+n.content+'</div></div>';
  } catch(e) {
    root.innerHTML = '<p class="muted" style="text-align:center;padding:60px">'+escapeHtml(e.message)+'</p>';
  }
}
</script>
</body>
</html>

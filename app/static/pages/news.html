<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Хабарҳо — СохтМатериал</title>
  <link rel="stylesheet" href="/css/styles.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" />
  <style>
    .news-page{max-width:1000px;margin:0 auto;padding:40px 24px}
    .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:24px}
    .news-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .2s,transform .15s;cursor:pointer}
    .news-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
    .news-card img{width:100%;height:180px;object-fit:cover}
    .news-card-body{padding:16px 20px}
    .news-card-body h3{margin:0 0 8px;font-size:17px}
    .news-card-body p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
    .news-card-body .date{font-size:12px;color:var(--muted)}
    .news-pin{position:absolute;top:10px;right:10px;background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .news-card{position:relative}

    .news-detail{max-width:800px;margin:0 auto;padding:40px 24px}
    .news-detail h1{font-size:28px;margin-bottom:12px}
    .news-detail .meta{color:var(--muted);margin-bottom:24px;font-size:14px}
    .news-detail img.hero{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:24px}
    .news-detail .body{line-height:1.8;font-size:16px}
    .news-detail .body h1,.news-detail .body h2,.news-detail .body h3{margin:20px 0 10px}
    .news-detail .body img{max-width:100%;border-radius:8px}
    .news-detail .body blockquote{border-left:4px solid var(--primary);padding:12px 20px;background:var(--bg2);border-radius:0 8px 8px 0;margin:16px 0}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><div class="brand-icon">С</div><span data-i18n="brand_full" data-site-setting="site_name">СохтМатериал</span></a>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" /><span class="slider"></span></label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
          <option value="tj">TJ</option><option value="ru">RU</option><option value="en">EN</option>
        </select>
      </div>
      <a href="/pages/auth.html" id="auth-link" class="btn btn-primary btn-login" data-i18n="login">Ворид шудан</a>
    </div>
  </div>
</header>

<div id="news-root"></div>

<footer class="footer">
  <div class="footer-bottom">
    <span>&copy; <span data-current-year>2026</span> <span data-site-setting="site_name">СохтМатериал</span></span>
  </div>
</footer>
<div class="toast-container" id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script><script src="/js/site-settings.js"></script>
<script src="/js/cms-nav.js"></script>
<script src="/js/theme.js"></script>

<script src="/js/bottom-tabs.js"></script>
</body>
</html>

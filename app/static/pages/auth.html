<!doctype html>
<html lang="ru">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>СохтМатериал | Авторизатсия</title><link rel="stylesheet" href="/css/styles.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" />
<style>
  .password-field{position:relative}
  .password-field input{padding-right:96px}
  .password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--primary);font-weight:700;cursor:pointer;padding:6px 8px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><div class="brand-icon">С</div><span data-i18n="brand_full">СохтМатериал</span></a>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" /><span class="slider"></span></label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value)"><option value="tj">TJ</option><option value="ru">RU</option><option value="en">EN</option></select>
      </div>
      <a href="/pages/auth.html" id="auth-link" class="btn btn-primary btn-login" data-i18n="login">Ворид шудан</a>
    </div>
  </div>
</header>
<div class="auth-page">
  <div class="auth-card slide-up">
    <h1 id="auth-title" data-i18n="login">Ворид шудан</h1>
    <p class="subtitle" id="auth-subtitle" data-i18n="login_subtitle">Ба ҳисоби худ ворид шавед</p>
    <div id="auth-fields">
      <input id="a-email" type="email" placeholder="Email" />
      <div class="password-field">
        <input id="a-password" type="password" placeholder="Пароль" />
        <button type="button" class="password-toggle" onclick="togglePassword('a-password', this)" data-state="hidden" data-i18n="show_password">Нишон</button>
      </div>
    </div>
    <p id="auth-message" class="muted" style="min-height:20px;font-size:13px;margin:8px 0"></p>
    <button class="btn btn-gradient" id="auth-btn" onclick="doAuth()" data-i18n="login">Ворид шудан</button>
    <p class="switch-mode"><span data-i18n="no_account">Ҳисоб надоред?</span> <a href="#" id="switch-link" onclick="switchMode(event)" data-i18n="register">Бақайдгирӣ</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script><script src="/js/cms-nav.js"></script><script src="/js/theme.js"></script><script src="/js/auth.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
<script src="/js/bottom-tabs.js"></script>
</body></html>

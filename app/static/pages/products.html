<!doctype html>
<html lang="ru">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>СохтМатериал | Маҳсулотҳо</title><link rel="stylesheet" href="/css/styles.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" /></head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><div class="brand-icon">С</div><span data-i18n="brand_full" data-site-setting="site_name">СохтМатериал</span></a>
    <div class="topbar-right">
      <div class="settings-bar">
        <label class="theme-switch"><input type="checkbox" id="theme-toggle" onchange="setTheme(this.checked?'dark':'light')" /><span class="slider"></span></label>
        <select class="lang-select" id="lang-select" onchange="setLang(this.value)"><option value="tj">TJ</option><option value="ru">RU</option><option value="en">EN</option></select>
      </div>
      <a href="/pages/auth.html" id="auth-link" class="btn btn-primary btn-login" data-i18n="login">Ворид шудан</a>
    </div>
  </div>
</header>
<main class="layout">
  <section class="toolbar">
    <input id="search" type="search" data-i18n="search_placeholder" placeholder="Ҷустуҷӯ: семент, кошин, асбоб..." />
    <select id="category"></select>
    <label class="check"><input id="in-stock" type="checkbox" /> <span data-i18n="in_stock">Дар анбор</span></label>
    <button class="btn btn-primary btn-sm" id="search-btn" data-i18n="find">Ёфтан</button>
  </section>
  <section id="products" class="product-grid"></section>
</main>
<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="footer-brand" data-i18n="brand_full" data-site-setting="site_name">СохтМатериал</div>
      <p data-i18n="footer_desc" data-site-setting="footer_desc">Маводҳои сохтмонии баландсифат аз беҳтарин истеҳсолкунандагон.</p>
    </div>
    <div>
      <h4 data-i18n="footer_nav">Навигатсия</h4>
      <a href="/" data-i18n="nav_home">Асосӣ</a>
      <a href="/pages/products.html" data-i18n="nav_products">Маҳсулотҳо</a>
    </div>
    <div>
      <h4 data-i18n="footer_contact">Тамос</h4>
      <a href="tel:+992000000000" data-site-setting="site_phone" data-site-setting-href="site_phone">+992 (00) 000-00-00</a>
      <a href="mailto:info@sokhtmaterial.tj" data-site-setting="site_email" data-site-setting-href="site_email">info@sokhtmaterial.tj</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>&copy; <span data-current-year>2026</span> <span data-site-setting="site_name">СохтМатериал</span></span>
    <span data-i18n="footer_rights">Ҳамаи ҳуқуқҳо маҳфузанд</span>
  </div>
</footer>
<div class="toast-container" id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script><script src="/js/site-settings.js"></script><script src="/js/cms-nav.js"></script><script src="/js/theme.js"></script><script src="/js/catalog.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
<script src="/js/bottom-tabs.js"></script>
</body></html>

name: buildshop

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildshop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: buildshop-backend
    env_file: .env  # ✅ добавить — подхватывает ВСЕ переменные из .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Остальные переменные теперь берутся из .env автоматически
    ports:
      - "8001:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./docs:/code/docs
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build: .
    container_name: buildshop-telegram-bot
    env_file: .env  # ✅ добавить
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./app:/code/app
      - ./run_bot.py:/code/run_bot.py
    depends_on:
      postgres:
        condition: service_healthy
    command: python run_bot.py
    restart: unless-stopped

volumes:
  postgres_data:
